# ==============================================================================
# Production Docker Compose Override for AWS EC2 Deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  postgres:
    restart: always
    # Security: Explicit empty ports block removes any published host port mappings
    ports: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?error POSTGRES_USER required in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error POSTGRES_PASSWORD required in production}
      POSTGRES_DB: ${POSTGRES_DB:?error POSTGRES_DB required in production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?error POSTGRES_USER required in production} -d ${POSTGRES_DB:?error POSTGRES_DB required in production}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB

  redis:
    restart: always
    # Security: Explicit empty ports block removes any published host port mappings
    ports: []
    command: redis-server --save 60 1 --loglevel warning

  auth-service:
    restart: always
    environment:
      APP_ENV: production
      AUTH_PORT: ${AUTH_PORT:-8081}
      DATABASE_URL: postgres://${POSTGRES_USER:?error POSTGRES_USER required in production}:${POSTGRES_PASSWORD:?error POSTGRES_PASSWORD required in production}@postgres:5432/${POSTGRES_DB:?error POSTGRES_DB required in production}?sslmode=${POSTGRES_SSLMODE:-disable}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?error JWT_SECRET required in production}
      JWT_ISSUER: ${JWT_ISSUER:-apigateway-auth-service}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?error CORS_ALLOWED_ORIGINS required in production (e.g. https://your-app.vercel.app)}
    ports:
      # Auth service port exposed for application traffic
      - "${AUTH_PORT:-8081}:${AUTH_PORT:-8081}"
