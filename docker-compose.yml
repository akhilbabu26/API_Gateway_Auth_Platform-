# ==============================================================================
# Base Docker Compose Configuration for API Gateway Platform
# Applies to both Local Development and Production EC2 Deployment
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: apigateway_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-apigateway_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apigateway_auth}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: apigateway_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: apigateway_auth_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_PORT: ${AUTH_PORT:-8081}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@postgres:5432/${POSTGRES_DB:-apigateway_auth}?sslmode=disable}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-super-secret-production-grade-hmac-key-256bit}
      JWT_ISSUER: ${JWT_ISSUER:-apigateway-auth-service}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      # Exposed for initial AWS testing or direct consumption
      - "${AUTH_PORT:-8081}:${AUTH_PORT:-8081}"
    networks:
      - internal-net

volumes:
  postgres_data:
  redis_data:

networks:
  internal-net:
    driver: bridge
